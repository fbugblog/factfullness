<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img"><style>text{font-family:sans-serif;fill:#183c34;font-size:17px}.small{font-size:13px;fill:#52634f}.bold{font-weight:bold;font-size:20px}</style><rect width="720" height="270" rx="12" fill="#edf0e6"/><text x="30" y="38" class="bold">状態と方向は、別のものさし</text><rect x="30" y="65" width="315" height="133" rx="7" fill="#fff"/><rect x="365" y="65" width="325" height="133" rx="7" fill="#fff"/><text x="50" y="96" class="small">今の状態を見る</text><text x="50" y="133" class="bold">まだ、問題がある。</text><text x="50" y="169">被害や困り事への対応が必要</text><text x="385" y="96" class="small">変化の方向を見る</text><text x="385" y="133" class="bold">前より、良くなった。</text><text x="385" y="169">役立った対策を確かめる</text><text x="30" y="240">どちらも同時に言える。片方を消す必要はない。</text></svg>