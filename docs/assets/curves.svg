<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img"><style>text{font-family:sans-serif;fill:#183c34;font-size:17px}.small{font-size:13px;fill:#52634f}.bold{font-weight:bold;font-size:20px}</style><rect width="720" height="270" rx="12" fill="#edf0e6"/><text x="30" y="38" class="bold">線の続きを描く前に、増え方の仕組みを考える</text><path d="M65 65V213H660" stroke="#94a58d" fill="none" stroke-width="2"/><path d="M80 200L570 65" stroke="#888" stroke-width="3" stroke-dasharray="7 6" fill="none"/><path d="M80 200C230 200 245 190 310 130S390 81 650 81" stroke="#366b47" stroke-width="5" fill="none"/><text x="505" y="58" class="small">直線の延長</text><text x="480" y="114" class="small">上限へ近づく形もある</text><text x="30" y="252" class="small">概念図。軸に実測の単位はなく、特定の人口や商品の予測ではありません。</text></svg>